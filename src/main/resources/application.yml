spring:
  application:
    name: awardhub
  profiles:
    active: prod

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: awardhub-dev-secret-key-replace-in-production-must-be-at-least-256-bits-long-for-hs256
    access-token-expiration: 900000    # 15 minutes in ms
    refresh-token-expiration: 604800000 # 7 days in ms
  otp:
    expiration: 300000  # 5 minutes in ms
    length: 6

logging:
  level:
    com.awardhub: DEBUG
    org.springframework.security: DEBUG
